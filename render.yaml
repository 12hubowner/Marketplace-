databases:
  - name: marketplace-db
    plan: free

services:
  - type: web
    name: marketplace
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn marketplace.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketplace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
